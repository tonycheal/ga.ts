<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ga.ts visualiser</title>
<script type="importmap">
{ "imports": {
    "three": "/node_modules/three/build/three.module.js",
    "three/addons/": "/node_modules/three/examples/jsm/"
}}
</script>
<style>
  :root {
    --paper:  #F1F3EF;
    --panel:  #FBFCFA;
    --ink:    #16302B;
    --muted:  #5F6F69;
    --rule:   #D3DAD5;
    --grid:   #E2E7E2;
    --axis:   #C6CFC9;
    --green:  #0E6E5B;
    --hot:    #A8452F;
    --cube:   #E7EBE7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #0F1512; --panel: #141B17; --ink: #E2E9E3; --muted: #8FA098;
      --rule: #2A3630; --grid: #1D2622; --axis: #2F3D37; --green: #52C7A6; --hot: #E0785C;
      --cube: #263029;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 14px/1.5 "Karla", system-ui, -apple-system, sans-serif;
    display: grid; grid-template-columns: 1fr 300px; height: 100vh;
  }
  @media (max-width: 780px) { body { grid-template-columns: 1fr; height: auto; } }

  main { display: flex; flex-direction: column; padding: 16px; gap: 12px; min-width: 0; min-height: 0; }
  #stage { flex: 1; position: relative; min-height: 260px; }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%;
                  border: 1px solid var(--rule); border-radius: 4px; display: block; }
  /* more specific than "#stage canvas", or the cube gets stretched to fill */
  #stage canvas#cube { inset: 10px 10px auto auto; width: 86px; height: 86px;
                       border: none; cursor: pointer; z-index: 2; background: transparent; }
  [hidden] { display: none !important; }

  aside {
    border-left: 1px solid var(--rule); padding: 18px 16px; overflow-y: auto;
    display: flex; flex-direction: column; gap: 16px; background: var(--panel);
  }
  h1 { font-size: 15px; margin: 0; letter-spacing: -0.01em; }
  h1 small { display: block; font-weight: 400; color: var(--muted); font-size: 12px;
             letter-spacing: 0.04em; text-transform: uppercase; margin-top: 3px; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted);
       margin: 0 0 8px; font-weight: 700; }

  .progs { display: flex; flex-direction: column; gap: 4px; }
  #dimtabs { margin-bottom: 8px; }
  button {
    border: 1px solid var(--rule); border-radius: 4px; background: transparent;
    color: var(--ink); font: inherit; cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--green); }
  button:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
  button:disabled { opacity: 0.4; cursor: default; }
  button[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: var(--panel); }
  .progs button { text-align: left; padding: 8px 10px; line-height: 1.3; }

  .blurb { color: var(--muted); font-size: 13px; margin: 0; }
  .rowbtns { display: flex; gap: 6px; }
  .rowbtns button { flex: 1; padding: 7px 0; }
  #play { font-weight: 700; }

  label.row { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  input[type=range] { width: 100%; accent-color: var(--green); }
  .val { font-family: ui-monospace, Menlo, monospace; color: var(--ink); }

  #note {
    font-family: ui-monospace, Menlo, monospace; font-size: 12px; line-height: 1.7;
    padding: 10px 12px; border: 1px solid var(--rule); border-radius: 4px;
    min-height: 3.4em; word-break: break-word; background: var(--paper);
  }
  footer { font-size: 11px; color: var(--muted); margin-top: auto; }
</style>
</head>
<body>

<main>
  <div id="stage">
    <canvas id="c"></canvas>
    <canvas id="c3" hidden></canvas>
    <canvas id="cube" hidden title="click a face, edge or corner"></canvas>
  </div>
  <div id="note">—</div>
</main>

<aside>
  <h1>ga.ts visualiser<small>Lie sphere geometry</small></h1>

  <div>
    <h2>Programs</h2>
    <div class="rowbtns" id="dimtabs">
      <button id="tab2" aria-pressed="true">2D · R(3,2)</button>
      <button id="tab3" aria-pressed="false">3D · R(4,2)</button>
    </div>
    <div class="progs" id="progs2"></div>
    <div class="progs" id="progs3" hidden></div>
  </div>

  <p class="blurb" id="blurb"></p>

  <div id="viewbox">
    <h2>View</h2>
    <div class="rowbtns">
      <button id="mSolid" aria-pressed="true">Solid</button>
      <button id="mProj" aria-pressed="false">Projection</button>
    </div>
  </div>

  <div>
    <h2>Transport</h2>
    <div class="rowbtns">
      <button id="back" title="step back">‹</button>
      <button id="play">Play</button>
      <button id="fwd" title="step forward">›</button>
    </div>
  </div>

  <div>
    <label class="row">Speed <span class="val" id="speedVal">0.15</span> /s</label>
    <input type="range" id="speed" min="0.01" max="1" step="0.01" value="0.15">
  </div>

  <div>
    <label class="row">Position <span class="val" id="tVal">0.00</span></label>
    <input type="range" id="scrub" min="0" max="1" step="0.001" value="0">
  </div>

  <div>
    <label class="row">Zoom <span class="val" id="zoomVal">8</span></label>
    <input type="range" id="zoom" min="2" max="20" step="0.5" value="8">
  </div>

  <footer>
    Not shipped in the npm package. Solver is provisional — see
    <code>visualiser/solver.js</code> and <code>ROADMAP.md</code>.
  </footer>
</aside>

<script type="module">
import { makeView, makePlayer, render } from "./viz.js";
import { makeScene3D, makeViewCube, project, AXES } from "./viz3d.js";
import { PROGRAMS } from "./programs.js";
import { PROGRAMS_3D } from "./programs3d.js";

const $ = (id) => document.getElementById(id);
const c2 = $("c"), c3 = $("c3"), cubeCanvas = $("cube");
const view = makeView(c2, 8);
const scene3 = makeScene3D(c3);
const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const cube = makeViewCube(cubeCanvas, (dir) => { scene3.setDirection(dir); player.redraw(); },
                          { face: css("--cube"), text: css("--ink") });

let is3D = false, mode = "solid", painting = false;

// Re-entrancy guard: painting the 3D view touches the camera, which can emit
// an orbit "change" that asks for another paint. One level is enough.
function paint(scene) {
  if (painting) return;
  painting = true;
  try {
    if (!is3D) { render(view, scene); return; }
    if (mode === "solid") {
      scene3.render(scene.shapes ?? []);
    } else {
      render(view, { shapes: project(scene.shapes ?? [], scene3.cameraDirection) });
    }
    cube.draw(scene3.cameraDirection);
  } finally {
    painting = false;
  }
}

const player = makePlayer({
  paint,
  onFrame({ t, note }) { $("note").textContent = note || "—"; $("scrub").value = t; $("tVal").textContent = t.toFixed(2); },
});

// orbiting should repaint, and keep the cube in step
scene3.controls.addEventListener("change", () => { if (is3D) player.redraw(); });

/* ---- program buttons ---- */
function makeButtons(list, host, threeD) {
  return list.map((p) => {
    const b = document.createElement("button");
    b.textContent = p.name;
    b.setAttribute("aria-pressed", "false");
    b.onclick = () => choose(p, threeD);
    host.appendChild(b);
    return b;
  });
}
const b2 = makeButtons(PROGRAMS, $("progs2"), false);
const b3 = makeButtons(PROGRAMS_3D, $("progs3"), true);

function choose(p, threeD) {
  is3D = threeD;
  view.halfWidth = p.halfWidth ?? 8;
  view.cx = p.cx ?? 0; view.cy = p.cy ?? 0;
  scene3.setHalfWidth(view.halfWidth);
  $("zoom").value = view.halfWidth;
  $("zoomVal").textContent = view.halfWidth;
  $("blurb").textContent = p.blurb;
  b2.forEach((b, i) => b.setAttribute("aria-pressed", String(!threeD && PROGRAMS[i] === p)));
  b3.forEach((b, i) => b.setAttribute("aria-pressed", String(threeD && PROGRAMS_3D[i] === p)));
  $("tab2").setAttribute("aria-pressed", String(!threeD));
  $("tab3").setAttribute("aria-pressed", String(threeD));
  $("progs2").hidden = threeD;
  $("progs3").hidden = !threeD;
  $("mSolid").disabled = !threeD;
  $("mProj").disabled = !threeD;
  $("viewbox").style.opacity = threeD ? 1 : 0.45;
  applyMode();
  player.load(p);
}

/* ---- 2D / 3D tabs: show one list, not both stacked ---- */
$("tab2").onclick = () => { if (is3D) choose(PROGRAMS[0], false); };
$("tab3").onclick = () => { if (!is3D) choose(PROGRAMS_3D[0], true); };

/* ---- solid vs projection ---- */
function applyMode() {
  const solid = is3D && mode === "solid";
  c3.hidden = !solid;
  c2.hidden = solid;
  cubeCanvas.hidden = !is3D;
  $("mSolid").setAttribute("aria-pressed", String(mode === "solid"));
  $("mProj").setAttribute("aria-pressed", String(mode === "projection"));
}
$("mSolid").onclick = () => { mode = "solid"; applyMode(); player.redraw(); };
$("mProj").onclick  = () => { mode = "projection"; applyMode(); player.redraw(); };

/* ---- transport ---- */
const playBtn = $("play");
playBtn.onclick = () => { playBtn.textContent = player.toggle() ? "Pause" : "Play"; };
$("back").onclick = () => { player.step(-0.02); playBtn.textContent = "Play"; };
$("fwd").onclick  = () => { player.step(+0.02); playBtn.textContent = "Play"; };
$("speed").oninput = (e) => { player.setSpeed(+e.target.value); $("speedVal").textContent = (+e.target.value).toFixed(2); };
$("scrub").oninput = (e) => { player.pause(); playBtn.textContent = "Play"; player.setT(+e.target.value); };
$("zoom").oninput = (e) => {
  view.halfWidth = +e.target.value;
  scene3.setHalfWidth(view.halfWidth);
  $("zoomVal").textContent = e.target.value;
  player.redraw();
};

addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT") return;
  if (e.code === "Space") { e.preventDefault(); playBtn.click(); }
  if (e.code === "ArrowLeft")  { e.preventDefault(); $("back").click(); }
  if (e.code === "ArrowRight") { e.preventDefault(); $("fwd").click(); }
});
addEventListener("resize", () => player.redraw());

choose(PROGRAMS[0], false);
</script>
</body>
</html>
